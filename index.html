<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加密笔记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 致命错误（非安全上下文等） -->
  <div id="fatal" class="hidden">
    <div class="card">
      <h1>无法启动</h1>
      <p id="fatal-msg"></p>
    </div>
  </div>

  <!-- 锁屏 / 创建 -->
  <div id="lock-screen" class="hidden">
    <div class="card">
      <h1>🔒 加密笔记</h1>
      <p class="muted" id="lock-subtitle">所有数据在本地加密存储，密钥由你的密码派生。</p>
      <div id="banner-area"></div>
      <input type="password" id="password-input" placeholder="密码" autocomplete="current-password">
      <input type="password" id="password-confirm" class="hidden" placeholder="确认密码" autocomplete="new-password">
      <p id="lock-error" class="error hidden"></p>
      <button id="unlock-btn" class="primary">解锁</button>
      <p class="muted small" id="lock-hint"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-screen" class="hidden">
    <header>
      <span class="logo">🔒 加密笔记</span>
      <span id="mode-badge" class="badge"></span>
      <div class="spacer"></div>
      <button id="new-note-btn">新建</button>
      <button id="rotate-btn">轮换密钥</button>
      <button id="migrate-btn" class="hidden">迁移旧数据 <span id="legacy-count" class="badge warn"></span></button>
      <button id="passwd-btn">改密码</button>
      <button id="export-btn">导出</button>
      <button id="lock-btn">锁定</button>
    </header>

    <div id="quota-banner" class="banner error-banner hidden">
      存储空间不足，新内容可能无法保存。建议立即导出备份并清理数据。
      <button id="quota-export-btn">导出备份</button>
    </div>
    <div id="privacy-banner" class="banner warn-banner hidden">
      隐私/无痕模式：浏览器禁止持久化存储，数据仅保存在内存中，关闭页面即丢失。请及时导出备份。
    </div>

    <div id="progress-area" class="hidden">
      <span id="progress-label"></span>
      <div class="progress"><div id="progress-bar"></div></div>
    </div>

    <div id="toast" class="hidden"></div>

    <div class="layout">
      <aside id="note-list"></aside>
      <section id="editor-area">
        <div id="empty-state" class="muted">选择或新建一条笔记</div>
        <textarea id="editor" class="hidden" placeholder="在这里输入，内容将加密后存储…"></textarea>
        <div id="editor-footer" class="hidden">
          <span id="save-status" class="muted small"></span>
          <button id="delete-note-btn" class="danger">删除</button>
        </div>
      </section>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="passwd-modal" class="modal hidden">
    <div class="card">
      <h2>修改密码</h2>
      <p class="muted small">仅重新包裹密钥，笔记密文不变。</p>
      <input type="password" id="new-password" placeholder="新密码">
      <input type="password" id="new-password-confirm" placeholder="确认新密码">
      <p id="passwd-error" class="error hidden"></p>
      <div class="row">
        <button id="passwd-cancel">取消</button>
        <button id="passwd-ok" class="primary">确认</button>
      </div>
    </div>
  </div>

  <script src="js/crypto-core.js"></script>
  <script src="js/crypto-worker.js"></script>
  <script src="js/crypto-client.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
